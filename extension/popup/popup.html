<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>똑바</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>똑바</h1>
    <span class="header-desc">찜한 상품 가격이 내려가면 알려드려요</span>
    <span id="status" class="status"></span>
    <button id="debugBtn" class="debug-open" title="디버그 창 열기" aria-label="디버그 창 열기">🛠</button>
  </header>

  <section id="current" class="current">
    <div class="current-head">
      <div class="current-info">
        <span id="currentName" class="current-name">상품 페이지를 열면 자동으로 추적합니다</span>
        <span id="currentPrice" class="current-price"></span>
        <div id="mallLinks" class="mall-links hidden">
          <a href="https://www.coupang.com/" target="_blank">쿠팡</a>
          <a href="https://smartstore.naver.com/" target="_blank">네이버 스마트스토어</a>
          <a href="https://www.oliveyoung.co.kr/" target="_blank">올리브영</a>
        </div>
      </div>
      <div class="current-stats">
        <span id="dealBadge" class="deal-badge hidden"></span>
        <span id="currentStats" class="stats-text"></span>
      </div>
      <div id="currentActions" class="current-actions hidden">
        <span class="current-hint">가격이 내려가면 알림으로 알려 드려요~</span>
        <button id="watchBtn" class="btn btn-primary">찜하기</button>
        <div id="targetRow" class="target-row hidden">
          <span id="targetStatus" class="target-status">목표가 미설정</span>
          <div class="target-controls">
            <input id="targetInput" class="target-input" type="number" min="1000" step="100" placeholder="목표가 (원)">
            <button id="targetSave" class="btn target-save">목표가 저장</button>
            <button id="targetClear" class="btn target-clear" disabled>설정 해제</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="related" class="related hidden">
    <div class="related-head">
      <h2>함께 본 상품</h2>
      <span class="related-hint">이 상품을 본 분들이 함께 본 상품</span>
      <button id="relatedToggle" class="list-toggle" title="펼치기/접기">▾</button>
    </div>
    <ul id="relatedList" class="related-list"></ul>
  </section>

  <section id="deals" class="deals">
    <div class="deals-head">
      <h2>오늘의 핫딜</h2>
      <div class="deals-days">
        <button data-days="1" class="deal-day-btn">1일</button>
        <button data-days="7" class="deal-day-btn active">7일</button>
        <button data-days="30" class="deal-day-btn">30일</button>
      </div>
    </div>
    <ul id="dealList" class="deal-list"><li class="row-loading"><span class="spinner"></span>불러오는 중…</li></ul>
    <p id="dealEmpty" class="empty hidden">아직 하락 기록이 없습니다.<br>쇼핑을 하면 자동으로 쌓여요!</p>
  </section>

  <script src="../common.js"></script>
  <script src="../debug.js"></script>
  <script src="popup.js"></script>
</body>
</html>
