<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>똑바</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>똑바</h1>
    <span class="header-desc">찜한 상품 가격이 내려가면 알려드려요</span>
    <span id="status" class="status"></span>
  </header>

  <section id="current" class="current">
    <div class="current-head">
      <div class="current-info">
        <span id="currentName" class="current-name">상품 페이지를 열면 자동으로 추적합니다</span>
        <span id="currentPrice" class="current-price"></span>
      </div>
      <div class="current-stats">
        <span id="dealBadge" class="deal-badge hidden"></span>
        <span id="currentStats" class="stats-text"></span>
      </div>
      <div id="currentActions" class="current-actions hidden">
        <span class="current-hint">가격이 내려가면 알림으로 알려 드려요~</span>
        <button id="watchBtn" class="btn btn-primary">찜하기</button>
        <div id="targetRow" class="target-row hidden">
          <input id="targetInput" class="target-input" type="number" min="1000" step="100" placeholder="목표가 (원)">
          <button id="targetSave" class="btn btn-ghost">목표가 저장</button>
        </div>
      </div>
    </div>
  </section>

  <section id="deals" class="deals">
    <div class="deals-head">
      <h2>오늘의 핫딜</h2>
      <div class="deals-days">
        <button data-days="1" class="deal-day-btn">1일</button>
        <button data-days="7" class="deal-day-btn active">7일</button>
        <button data-days="30" class="deal-day-btn">30일</button>
      </div>
    </div>
    <ul id="dealList" class="deal-list"><li class="row-loading"><span class="spinner"></span>불러오는 중…</li></ul>
    <p id="dealEmpty" class="empty hidden">아직 하락 기록이 없습니다.<br>쇼핑을 하면 자동으로 쌓여요!</p>
  </section>

  <section id="listSection">
    <div class="list-head">
      <h2>찜 목록 <span id="watchCount" class="watch-count"></span></h2>
      <div class="list-head-right">
        <div class="mall-filter">
          <button data-mall="all" class="mall-filter-btn active">전체</button>
          <button data-mall="naver" class="mall-filter-btn">네이버</button>
          <button data-mall="coupang" class="mall-filter-btn">쿠팡</button>
          <button data-mall="oliveyoung" class="mall-filter-btn">올리브영</button>
        </div>
        <button id="listToggle" class="list-toggle" title="펼치기/접기">▾</button>
      </div>
    </div>
    <ul id="watchList" class="watch-list"><li class="row-loading"><span class="spinner"></span>불러오는 중…</li></ul>
    <p id="emptyMsg" class="empty hidden">찜한 상품이 없습니다.<br>상품 페이지에서 똑바 아이콘을 누르고 찜해 보세요.</p>
  </section>

  <div id="confirmDlg" class="confirm hidden">
    <div class="confirm-box">
      <div id="confirmMsg" class="confirm-msg"></div>
      <div class="confirm-actions">
        <button id="confirmNo" class="btn btn-ghost">취소</button>
        <button id="confirmYes" class="btn btn-danger">삭제</button>
      </div>
    </div>
  </div>

  <script src="../common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
