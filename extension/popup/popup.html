<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>똑바</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>똑바</h1>
    <span id="status" class="status"></span>
  </header>

  <section id="alerts" class="alerts hidden">
    <h2>알림 내역</h2>
    <ul id="alertList" class="alert-list"></ul>
  </section>

  <section id="current" class="current">
    <div class="current-head">
      <span id="currentName" class="current-name">상품 페이지를 열면 자동으로 추적합니다</span>
    </div>
    <div id="currentActions" class="current-actions hidden">
      <button id="watchBtn" class="btn btn-primary">찜하기</button>
    </div>
  </section>

  <section id="listSection">
    <h2>찜 목록</h2>
    <ul id="watchList" class="watch-list"></ul>
    <p id="emptyMsg" class="empty">찜한 상품이 없습니다.<br>상품 페이지에서 똑바 아이콘을 누르고 찜해 보세요.</p>
  </section>

  <div id="confirmDlg" class="confirm hidden">
    <div class="confirm-box">
      <div id="confirmMsg" class="confirm-msg"></div>
      <div class="confirm-actions">
        <button id="confirmNo" class="btn btn-ghost">취소</button>
        <button id="confirmYes" class="btn btn-danger">삭제</button>
      </div>
    </div>
  </div>

  <script src="../common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
