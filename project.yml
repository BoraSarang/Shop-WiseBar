name: ShopWiseBar
options:
  bundleIdPrefix: com.borasarang
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
targets:
  ShopWiseBar:
    type: application
    platform: macOS
    sources:
      - path: ShopWiseBar
      - path: error_message_ko.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.ShopWiseBar
        PRODUCT_NAME: ShopWiseBar
        INFOPLIST_FILE: ShopWiseBar/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - sdk: Charts.framework
schemes:
  ShopWiseBar:
    build:
      targets:
        ShopWiseBar: all
    run:
      config: Debug
    archive:
      config: Release
