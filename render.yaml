# Render 블루프린트 (v0.16.4, T-120) — 운영 서버 배포 정의를 코드로 고정
# 사용법: Render Dashboard → New + → Blueprint → 이 repo 연결 → `render.yaml` Apply.
#   기존 Python Web Service가 있는 경우 블루프린트는 새 서비스로 생성되므로
#   DATABASE_URL 등 환경변수만 재입력. (기존 무료 티어 서비스는 비활성/삭제)
# 플랫폼: server · 플랜: free (무료 티어)
#
# 런타임: Docker (server/Dockerfile). 이유:
#   Render NixPacks(python) 빌드는 non-root → `playwright install --with-deps chromium`의
#   apt-get 단계가 "su: Authentication failure"로 실패 (2026-08-10 운영 실측, 빌드 실패).
#   Docker는 루트로 빌드하므로 apt-get + playwright chromium 사전 설치가 가능.
#
# 주의: dockerfilePath/dockerContext 경로는 rootDir 기준 (이 파일은 저장소 루트에 있음).
services:
  - type: web
    name: shop-wisebar
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # v0.16.12 — web은 uvicorn 단독 (worker 미포함) — Chrome 메모리와 격리, /health 안정 유지.
    command: sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    envVars:
      - key: DATABASE_URL
        sync: false
        comment: >-
          Neon PostgreSQL 연결 문자열. Render Dashboard → Environment에서 실값 입력
          (블루프린트 sync:false — 절대 git에 노출 금지). 없으면 서버가 SQLite로 fallback.
      - key: CORS_ORIGINS
        value: chrome-extension://ogbofhjdiiodafcbbowjdniaikapebhe,https://borasarang.github.io

  # v0.16.12 (T-123) — 크롤러 워커 배치 정지(일시): crawler_config.enabled=false (운영 반영 완료).
  #   두 가지 재개 방법을 모두 준비해 두었음 — 활성화는 오직 한 가지만 선택할 것 (중복 구동 금지):
  #
  #   ① Render worker 서비스 (유료 $7/월): 아래 worker 서비스 정의 사용
  #      - 위 web은 command로 uvicorn 단독 실행(worker 미포함) → Chrome 격리 → /health 항상 빠름
  #      - Render Dashboard → Blueprint Sync 시 shop-wisebar-worker 자동 생성
  #      - 생성 후 PUT /admin/crawler/config {enabled:true} 로 재개
  #
  #   ② 로컬 macOS 크롤러 (무료): scripts/run-local-crawler.sh + com.shopwisebar.crawler.plist
  #      - 이 맥에서 Playwright(로컬 Chrome)로 배치 수행 — 이 맥이 켜져 있어야 함
  #      - launchctl load 후 PUT /admin/crawler/config {enabled:true}
  #
  #   ※ ①과 ②를 동시에 켜면 배치가 2번 돌 수 있음. 반드시 한 가지만 활성화할 것.

  - type: worker
    name: shop-wisebar-worker
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    command: python -m crawlers.worker
    healthCheckPath: ""
    envVars:
      - key: DATABASE_URL
        sync: false
        comment: web 서비스와 동일한 Neon 연결 문자열