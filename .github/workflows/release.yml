name: Release Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리즈 태그 (예: v0.10.2)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Syntax check (node --check)
        run: |
          for f in extension/*.js extension/popup/*.js; do
            node --check "$f" || exit 1
          done
          echo "All JS files passed syntax check."

      - name: Validate manifest.json
        run: |
          python3 -c "
          import json
          m = json.load(open('extension/manifest.json'))
          assert m['manifest_version'] == 3
          assert 'version' in m and 'name' in m and 'description' in m
          assert 'action' in m and 'icons' in m and 'background' in m
          assert 'unsafe-eval' not in json.dumps(m.get('content_security_policy',''))
          print('manifest OK —', m['name'], 'v'+m['version'], '| perms:', m['permissions'])
          "

      - name: Verify manifest version matches tag
        run: |
          V=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "manifest version: $V"
          echo "release version:  ${{ steps.ver.outputs.tag }}"
          if [ "$V" != "${{ steps.ver.outputs.tag }}" ]; then
            echo "::error::manifest version($V)와 릴리즈 태그(v${{ steps.ver.outputs.tag }})가 다릅니다."
            exit 1
          fi

      - name: Package extension zip
        run: |
          mkdir -p dist
          ZIP="dist/shop-wisebar-v${{ steps.ver.outputs.tag }}.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" extension -x "*/shopwisebar.db" "*/shopwisebar.db-*" "*.DS_Store" >/dev/null
          unzip -l "$ZIP" | grep -q "extension/manifest.json"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          du -h "$ZIP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.tag }}
          name: 똑바 (Shop WiseBar) v${{ steps.ver.outputs.tag }}
          files: ${{ env.ZIP }}
          generate_release_notes: true
          fail_on_unmatched_files: true
